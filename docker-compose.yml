name: sparkpilot

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparkpilot
      POSTGRES_PASSWORD: sparkpilot
      POSTGRES_DB: sparkpilot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkpilot -d sparkpilot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
